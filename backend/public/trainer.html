<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trainer Dashboard</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .meeting-card {
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
      background: #f7f7f7;
    }

    .meeting-card h3 {
      margin: 0 0 10px 0;
    }

    .approve-box {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input, select {
      padding: 8px;
    }

    .btn {
      padding: 8px 15px;
      background: #1a73e8;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .trainer-info {
      padding: 15px;
      background: #e8f0fe;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <header>
    <h2>Trainer Dashboard – Meeting Requests</h2>
  </header>

  <!-- Trainer Info -->
  <section id="trainerDetails" class="trainer-info">
    Loading trainer info...
  </section>

  <!-- Meeting Requests -->
  <section class="container">
    <div id="requestList">Loading requests...</div>
  </section>

  <script>
    // Load Trainer Info
    async function loadTrainerInfo() {
      try {
        const res = await fetch("/api/trainers");   // ✅ FIXED
        const trainers = await res.json();
        const trainer = trainers[0];

        const box = document.getElementById("trainerDetails");
        box.innerHTML = `
          <h3>Trainer Information</h3>
          <p><b>Name:</b> ${trainer?.name || "Unknown"}</p>
          <p><b>Email:</b> ${trainer?.email || "No email"}</p>
        `;
      } catch (err) {
        console.error(err);
        document.getElementById("trainerDetails").innerText = "Failed to load trainer info.";
      }
    }

    // Load Pending Meeting Requests
    async function loadRequests() {
      try {
        const res = await fetch("/api/meetings/list");   // ✅ FIXED
        const meetings = await res.json();

        const container = document.getElementById("requestList");
        container.innerHTML = "";

        meetings
          .filter(m => m.status === "Pending")
          .forEach(meeting => {
            const card = document.createElement("div");
            card.className = "meeting-card";

            card.innerHTML = `
              <h3>Student: ${meeting.studentId?.name || "Unknown"}</h3>
              <p>Email: ${meeting.studentId?.email || "No email"}</p>
              <p><b>Requested:</b> ${meeting.requestedDate}</p>

              <div class="approve-box">
                <label>Date:</label>
                <input type="date" id="date-${meeting._id}" required>

                <label>Time:</label>
                <input type="time" id="time-${meeting._id}" required>

                <select id="ampm-${meeting._id}">
                  <option value="AM">AM</option>
                  <option value="PM">PM</option>
                </select>

                <button class="btn" onclick="approve('${meeting._id}')">Approve</button>
              </div>
            `;

            container.appendChild(card);
          });

        if (!meetings.some(m => m.status === "Pending")) {
          container.innerHTML = "<p>No pending meeting requests.</p>";
        }

      } catch (err) {
        console.error(err);
        document.getElementById("requestList").innerText = "Failed to load meeting requests.";
      }
    }

    // Approve Meeting
    async function approve(meetingId) {
      const date = document.getElementById(`date-${meetingId}`).value;
      const time = document.getElementById(`time-${meetingId}`).value;
      const ampm = document.getElementById(`ampm-${meetingId}`).value;

      if (!date || !time) {
        alert("Please select date and time");
        return;
      }

      let [hours, minutes] = time.split(":").map(Number);
      let formattedTime = "";

      if (hours === 0) formattedTime = `12:${minutes.toString().padStart(2,'0')} AM`;
      else if (hours === 12) formattedTime = `12:${minutes.toString().padStart(2,'0')} PM`;
      else if (hours > 12) formattedTime = `${hours-12}:${minutes.toString().padStart(2,'0')} PM`;
      else formattedTime = `${hours}:${minutes.toString().padStart(2,'0')} AM`;

      formattedTime = formattedTime.replace(/AM|PM/, ampm);

      const finalDate = `${date} at ${formattedTime}`;

      try {
        const res = await fetch("/api/meetings/approve", {   // ✅ FIXED
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ meetingId, finalDate })
        });

        if (res.ok) {
          alert("Meeting approved & email sent to student!");
          loadRequests();
        } else {
          alert("Error approving meeting");
        }
      } catch (err) {
        console.error(err);
        alert("Error approving meeting");
      }
    }

    loadTrainerInfo();
    loadRequests();
  </script>
</body>
</html>
